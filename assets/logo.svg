<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-labelledby="t">
  <title id="t">gradient</title>
  <!--
    The mark is ∇, the gradient operator: the direction of steepest change.
    Knocked out rather than painted, so the tile carries the brand ramp
    (violet → coral) and the glyph reads on any background behind it.
  -->
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7C6CFF"/>
      <stop offset="1" stop-color="#FF7E6B"/>
    </linearGradient>
    <mask id="cut">
      <rect width="64" height="64" fill="#fff"/>
      <path d="M17 21h30L32 47Z" fill="#000" stroke="#000" stroke-width="5" stroke-linejoin="round"/>
    </mask>
  </defs>
  <rect width="64" height="64" rx="15" fill="url(#g)" mask="url(#cut)"/>
</svg>
